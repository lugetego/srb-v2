security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        export_api:
            pattern: ^/api/export
            stateless: true
            custom_authenticators:
                - App\Security\ExportApiTokenAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_reference_index
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_reference_index

    access_control:
        # API de exportación — token estático, sin sesión
        - { path: ^/api/export,          roles: ROLE_API_EXPORT }

        # Rutas públicas (consulta sin autenticación)
        - { path: ^/login$,              roles: PUBLIC_ACCESS }
        - { path: ^/$,                   roles: PUBLIC_ACCESS }
        - { path: ^/busqueda,            roles: PUBLIC_ACCESS }
        - { path: ^/refs$,               roles: PUBLIC_ACCESS }
        - { path: ^/refs/data,           roles: PUBLIC_ACCESS }
        - { path: ^/refs/\d+-,            roles: PUBLIC_ACCESS }
        - { path: ^/authors$,            roles: PUBLIC_ACCESS }
        - { path: ^/authors/\d+/show$,   roles: PUBLIC_ACCESS }

        # Escritura sobre referencias — cualquier usuario autenticado
        - { path: ^/refs/new$,           roles: ROLE_USER }
        - { path: ^/refs/\d+/edit$,      roles: ROLE_USER }
        - { path: ^/refs/\d+/delete$,    roles: ROLE_USER }

        # Gestión de autores — solo administradores
        - { path: ^/authors/new$,        roles: ROLE_ADMIN }
        - { path: ^/authors/\d+/edit$,   roles: ROLE_ADMIN }
        - { path: ^/authors/\d+/delete$, roles: ROLE_ADMIN }

        # Catch-all: cualquier otra ruta requiere login
        - { path: ^/,                    roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
